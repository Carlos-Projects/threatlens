<!DOCTYPE html>
<html data-theme="dark">
<head>
    <title>ThreatLens Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="navbar bg-gray-800 shadow-lg mb-6">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl" href="/">🔍 ThreatLens</a>
        </div>
        <div class="flex-none gap-2">
            <ul class="menu menu-horizontal px-1">
                <li><a href="/" class="text-gray-300 hover:text-white">Dashboard</a></li>
                <li><a href="/signals" class="text-gray-300 hover:text-white"
                       hx-get="/signals" hx-target="#content">Signals</a></li>
                <li><a href="/alerts" class="text-gray-300 hover:text-white"
                       hx-get="/alerts" hx-target="#content">Alerts</a></li>
            </ul>
        </div>
    </div>

    <div class="container mx-auto px-4">
        <div id="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
